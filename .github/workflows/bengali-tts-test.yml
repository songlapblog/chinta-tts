name: Chinta Automatic Multilingual TTS

on:
  repository_dispatch:
    types: [generate_tts]

permissions:
  contents: write

concurrency:
  group: chinta-tts-main-audio
  cancel-in-progress: false

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Piper and ffmpeg
        run: |
          python -m pip install --upgrade pip
          pip install "piper-tts[http]" requests

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download Bengali, English, and Arabic voices
        run: |
          python -m piper.download_voices bn_BD-google-medium
          python -m piper.download_voices en_US-lessac-medium
          python -m piper.download_voices ar_JO-kareem-medium

      - name: Decode article text
        env:
          ARTICLE_DATA: ${{ github.event.client_payload.article_data }}
          POST_ID: ${{ github.event.client_payload.post_id }}
        run: |
          if ! [[ "$POST_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid post ID"
            exit 1
          fi

          python <<'PY'
          import os
          import base64
          import gzip
          import pathlib

          encoded = os.environ["ARTICLE_DATA"]
          raw = base64.b64decode(encoded)
          text = gzip.decompress(raw).decode("utf-8")

          pathlib.Path("article.txt").write_text(
              text,
              encoding="utf-8"
          )

          print("Article characters:", len(text))
          PY

      - name: Start multilingual Piper server
        run: |
          nohup python -m piper.http_server \
            -m bn_BD-google-medium \
            --data-dir . \
            > piper.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:5000/info \
              >/dev/null; then
              echo "Piper ready"
              curl -fsS http://127.0.0.1:5000/voices || true
              exit 0
            fi
            sleep 1
          done

          cat piper.log
          exit 1

      - name: Generate multilingual audio segments
        run: |
          python <<'PY'
          import pathlib
          import re
          import requests

          VOICES = {
              "bn": "bn_BD-google-medium",
              "en": "en_US-lessac-medium",
              "ar": "ar_JO-kareem-medium",
          }

          MAX_CHARS = 900

          text = pathlib.Path("article.txt").read_text(
              encoding="utf-8"
          )

          def strong_language(char):
              code = ord(char)

              if 0x0980 <= code <= 0x09FF:
                  return "bn"

              if (
                  0x0600 <= code <= 0x06FF
                  or 0x0750 <= code <= 0x077F
                  or 0x08A0 <= code <= 0x08FF
                  or 0xFB50 <= code <= 0xFDFF
                  or 0xFE70 <= code <= 0xFEFF
              ):
                  return "ar"

              if (
                  "A" <= char <= "Z"
                  or "a" <= char <= "z"
              ):
                  return "en"

              return None

          counts = {"bn": 0, "en": 0, "ar": 0}

          for char in text:
              language = strong_language(char)
              if language:
                  counts[language] += 1

          default_language = max(counts, key=counts.get)

          if counts[default_language] == 0:
              raise RuntimeError(
                  "No Bengali, English, or Arabic text found"
              )

          runs = []
          current_language = default_language
          current_text = ""

          for char in text:
              language = strong_language(char)

              if language and language != current_language:
                  if current_text.strip():
                      runs.append(
                          (current_language, current_text.strip())
                      )

                  current_language = language
                  current_text = char
              else:
                  current_text += char

          if current_text.strip():
              runs.append(
                  (current_language, current_text.strip())
              )

          merged_runs = []

          for language, run_text in runs:
              run_text = re.sub(r"\s+", " ", run_text).strip()

              if not run_text:
                  continue

              if merged_runs and merged_runs[-1][0] == language:
                  previous_language, previous_text = merged_runs[-1]
                  merged_runs[-1] = (
                      previous_language,
                      f"{previous_text} {run_text}".strip()
                  )
              else:
                  merged_runs.append((language, run_text))

          def split_text(value, limit=MAX_CHARS):
              pieces = []
              remaining = value.strip()

              while len(remaining) > limit:
                  window = remaining[:limit + 1]

                  possible_cuts = [
                      window.rfind("।"),
                      window.rfind("."),
                      window.rfind("!"),
                      window.rfind("?"),
                      window.rfind("؟"),
                      window.rfind(" "),
                  ]

                  cut = max(possible_cuts)

                  if cut < 300:
                      cut = limit
                  else:
                      cut += 1

                  pieces.append(remaining[:cut].strip())
                  remaining = remaining[cut:].strip()

              if remaining:
                  pieces.append(remaining)

              return pieces

          segments = []

          for language, run_text in merged_runs:
              for piece in split_text(run_text):
                  if piece:
                      segments.append((language, piece))

          if not segments:
              raise RuntimeError(
                  "No article text to synthesize"
              )

          output = pathlib.Path("chunks")
          output.mkdir(exist_ok=True)

          manifest_lines = []

          for number, (language, segment_text) in enumerate(
              segments,
              1
          ):
              payload = {
                  "text": segment_text,
                  "voice": VOICES[language],
              }

              if language == "bn":
                  payload["speaker_id"] = 5

              response = requests.post(
                  "http://127.0.0.1:5000/synthesize",
                  json=payload,
                  timeout=300
              )

              response.raise_for_status()

              filename = output / (
                  f"part-{number:04d}-{language}.wav"
              )

              filename.write_bytes(response.content)

              manifest_lines.append(
                  f"file '{filename.resolve()}'"
              )

              print(
                  "Created",
                  filename,
                  "voice=",
                  VOICES[language],
                  "characters=",
                  len(segment_text)
              )

          pathlib.Path("concat.txt").write_text(
              "\n".join(manifest_lines) + "\n",
              encoding="utf-8"
          )

          print("Language counts:", counts)
          print("Default language:", default_language)
          print("Total audio segments:", len(segments))
          PY

      - name: Combine audio into MP3
        run: |
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c:a libmp3lame \
            -b:a 64k \
            chinta-article.mp3

          test -s chinta-article.mp3
          ls -lh chinta-article.mp3

      - name: Save MP3 to repository
        env:
          POST_ID: ${{ github.event.client_payload.post_id }}
        run: |
          mkdir -p audio

          cp chinta-article.mp3 \
            "audio/post-${POST_ID}.mp3"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "audio/post-${POST_ID}.mp3"

          if git diff --cached --quiet; then
            echo "Audio file is unchanged"
          else
            git commit -m \
              "Update multilingual TTS audio for post ${POST_ID}"

            git push
          fi
