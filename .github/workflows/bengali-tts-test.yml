name: Chinta Automatic Bengali TTS

on:
  repository_dispatch:
    types: [generate_tts]

permissions:
  contents: read

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Piper and ffmpeg
        run: |
          python -m pip install --upgrade pip
          pip install "piper-tts[http]" requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Bengali voice
        run: |
          python -m piper.download_voices bn_BD-google-medium

      - name: Decode article text
        env:
          ARTICLE_DATA: ${{ github.event.client_payload.article_data }}
        run: |
          python <<'PY'
          import os
          import base64
          import gzip

          encoded = os.environ["ARTICLE_DATA"]

          raw = base64.b64decode(encoded)
          text = gzip.decompress(raw).decode("utf-8")

          with open("article.txt", "w", encoding="utf-8") as f:
              f.write(text)

          print("Article characters:", len(text))
          PY

      - name: Start Piper server
        run: |
          nohup python -m piper.http_server \
            -m bn_BD-google-medium \
            > piper.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/info > /dev/null; then
              echo "Piper ready"
              exit 0
            fi
            sleep 1
          done

          cat piper.log
          exit 1

      - name: Generate Speaker 05 audio
        run: |
          python <<'PY'
          import pathlib
          import re
          import requests

          text = pathlib.Path("article.txt").read_text(encoding="utf-8")

          sentences = re.split(
              r'(?<=[।!?])\s+|\n+',
              text
          )

          chunks = []
          current = ""

          for sentence in sentences:
              sentence = sentence.strip()

              if not sentence:
                  continue

              if len(current) + len(sentence) + 1 <= 900:
                  current = (
                      current + " " + sentence
                  ).strip()
              else:
                  if current:
                      chunks.append(current)

                  while len(sentence) > 900:
                      cut = sentence.rfind(" ", 0, 900)

                      if cut < 300:
                          cut = 900

                      chunks.append(sentence[:cut].strip())
                      sentence = sentence[cut:].strip()

                  current = sentence

          if current:
              chunks.append(current)

          print("Audio chunks:", len(chunks))

          output = pathlib.Path("chunks")
          output.mkdir(exist_ok=True)

          for number, chunk in enumerate(chunks, 1):

              response = requests.post(
                  "http://127.0.0.1:5000/synthesize",
                  json={
                      "text": chunk,
                      "speaker_id": 5
                  },
                  timeout=300
              )

              response.raise_for_status()

              filename = output / f"part-{number:04d}.wav"
              filename.write_bytes(response.content)

              print("Created", filename)
          PY

      - name: Combine and create MP3
        run: |
          rm -f concat.txt

          for f in chunks/*.wav; do
            echo "file '$PWD/$f'" >> concat.txt
          done

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c:a libmp3lame \
            -b:a 64k \
            chinta-article.mp3

          ls -lh chinta-article.mp3

      - name: Upload finished audio
        uses: actions/upload-artifact@v6
        with:
          name: chinta-tts-${{ github.event.client_payload.job_key }}
          path: chinta-article.mp3
          if-no-files-found: error
          retention-days: 1
