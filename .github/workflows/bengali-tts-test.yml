name: Chinta Automatic Bengali TTS

on:
  repository_dispatch:
    types: [generate_tts]

permissions:
  contents: write

concurrency:
  group: chinta-tts-main-audio
  cancel-in-progress: false

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Piper and ffmpeg
        run: |
          python -m pip install --upgrade pip
          pip install "piper-tts[http]" requests

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download Bengali voice
        run: |
          python -m piper.download_voices bn_BD-google-medium

      - name: Decode article text
        env:
          ARTICLE_DATA: ${{ github.event.client_payload.article_data }}
          POST_ID: ${{ github.event.client_payload.post_id }}
        run: |
          if ! [[ "$POST_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid post ID"
            exit 1
          fi

          python <<'PY'
          import os
          import base64
          import gzip
          import pathlib

          encoded = os.environ["ARTICLE_DATA"]
          raw = base64.b64decode(encoded)
          text = gzip.decompress(raw).decode("utf-8")

          pathlib.Path("article.txt").write_text(
              text,
              encoding="utf-8"
          )

          print("Article characters:", len(text))
          PY

      - name: Start Piper server
        run: |
          nohup python -m piper.http_server \
            -m bn_BD-google-medium \
            > piper.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:5000/info \
              >/dev/null; then
              echo "Piper ready"
              exit 0
            fi
            sleep 1
          done

          cat piper.log
          exit 1

      - name: Generate Speaker 05 audio
        run: |
          python <<'PY'
          import pathlib
          import re
          import requests

          text = pathlib.Path(
              "article.txt"
          ).read_text(
              encoding="utf-8"
          )

          sentences = re.split(
              r'(?<=[।!?])\s+|\n+',
              text
          )

          chunks = []
          current = ""

          for sentence in sentences:
              sentence = sentence.strip()

              if not sentence:
                  continue

              if len(current) + len(sentence) + 1 <= 900:
                  current = (
                      current + " " + sentence
                  ).strip()
              else:
                  if current:
                      chunks.append(current)

                  while len(sentence) > 900:
                      cut = sentence.rfind(
                          " ",
                          0,
                          900
                      )

                      if cut < 300:
                          cut = 900

                      chunks.append(
                          sentence[:cut].strip()
                      )

                      sentence = (
                          sentence[cut:].strip()
                      )

                  current = sentence

          if current:
              chunks.append(current)

          if not chunks:
              raise RuntimeError(
                  "No article text to synthesize"
              )

          output = pathlib.Path("chunks")
          output.mkdir(exist_ok=True)

          for number, chunk in enumerate(
              chunks,
              1
          ):
              response = requests.post(
                  "http://127.0.0.1:5000/synthesize",
                  json={
                      "text": chunk,
                      "speaker_id": 5
                  },
                  timeout=300
              )

              response.raise_for_status()

              filename = (
                  output /
                  f"part-{number:04d}.wav"
              )

              filename.write_bytes(
                  response.content
              )

              print("Created", filename)

          print("Total chunks:", len(chunks))
          PY

      - name: Combine audio into MP3
        run: |
          rm -f concat.txt

          for f in chunks/*.wav; do
            echo "file '$PWD/$f'" >> concat.txt
          done

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c:a libmp3lame \
            -b:a 64k \
            chinta-article.mp3

          test -s chinta-article.mp3
          ls -lh chinta-article.mp3

      - name: Save MP3 to repository
        env:
          POST_ID: ${{ github.event.client_payload.post_id }}
        run: |
          mkdir -p audio

          cp chinta-article.mp3 \
            "audio/post-${POST_ID}.mp3"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "audio/post-${POST_ID}.mp3"

          if git diff --cached --quiet; then
            echo "Audio file is unchanged"
          else
            git commit -m \
              "Update TTS audio for post ${POST_ID}"

            git push
          fi
